<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>統計準1級｜講義ライブラリ</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#17304a;margin:0}main{max-width:820px;margin:auto;padding:20px 16px 80px}h1{font-size:clamp(23px,5vw,31px)}a{color:#1d587d}nav{display:flex;gap:18px;flex-wrap:wrap}.panel{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:18px;margin:14px 0}select,input{font:inherit;width:100%;padding:11px;border:1px solid #ccd9e5;border-radius:9px;box-sizing:border-box}label{display:block;margin:12px 0 6px}section h3{margin:0 0 8px}section{padding:12px 0;border-top:1px solid #e6eaf0;line-height:1.8;overflow-x:auto}.muted{font-size:13px;color:#697d90}.notice{background:#eff3fa;border-radius:9px;padding:10px;line-height:1.7}.katex-display{overflow-x:auto}</style></head><body><main><nav><a href="./index.html">← ダッシュボード</a><a href="./practice.html">演習へ</a></nav><h1>講義ライブラリ</h1><p class="muted">講義は論点単位で保存。採点前後を問わずいつでも閲覧できます。閲覧だけで進捗は更新されません。</p><div class="panel"><label for="filter">論点を検索</label><input id="filter" placeholder="例：ベイズ、T003"><label for="topic">保存済み講義</label><select id="topic"></select></div><div id="content" class="panel">講義マスタを読み込んでいます...</div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lectures={},topics=[],visible=[];
function options(){const filter=$("filter").value.trim().toLowerCase(),selected=$("topic").value;visible=topics.filter(t=>(t.id+" "+t.name+" "+t.domain).toLowerCase().includes(filter));$("topic").innerHTML=visible.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.id+" "+t.name+" ["+lectures[t.id].review_status+"]")+'</option>').join("");if(visible.some(t=>t.id===selected))$("topic").value=selected;show();}
function show(){const id=$("topic").value,l=lectures[id],t=topics.find(t=>t.id===id);if(!l){$("content").textContent="該当する講義はありません";return;}const fields=[["直感",l.intuition],["定義・主要公式",l.definition],["導出・根拠",l.derivation],["具体例",l.example],["成立条件",l.conditions],["典型ミス",l.pitfalls],["試験での判断基準",l.exam_criteria]];$("content").innerHTML='<h2>'+esc(id+" "+(t?.name||""))+'</h2><p class="muted">品質ステータス: '+esc(l.review_status)+' / '+esc(l.review_notes||"")+'</p>'+(l.formula_latex?'<div id="topic-formula" class="notice"></div>':'')+fields.filter(x=>x[1]).map(([n,v])=>'<section><h3>'+esc(n)+'</h3><div class="math">'+esc(v)+'</div></section>').join("")+'<p class="notice">講義閲覧では学習済みになりません。演習と採点・履歴保存によって進捗を更新します。</p>';if(l.formula_latex&&window.katex){try{window.katex.render(l.formula_latex,$("topic-formula"),{displayMode:true,throwOnError:false})}catch(e){$("topic-formula").textContent=l.formula_latex}}if(window.renderMathInElement)renderMathInElement($("content"),{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false});history.replaceState(null,"","?topic="+encodeURIComponent(id))}
async function load(){try{const [lr,pr]=await Promise.all([fetch("./data/lectures.json?t="+Date.now(),{cache:"no-store"}),fetch("./data/progress.json?t="+Date.now(),{cache:"no-store"})]);if(!lr.ok||!pr.ok)throw Error("教材マスタまたは論点データが未公開");lectures=(await lr.json()).lectures;const p=await pr.json();topics=p.topics.filter(t=>lectures[t.id]);options();const id=new URLSearchParams(location.search).get("topic");if(id&&lectures[id]){$("topic").value=id;show()}$("filter").addEventListener("input",options);$("topic").addEventListener("change",show)}catch(e){$("content").textContent="講義の読み込みに失敗しました: "+e.message;}}load();
</script></body></html>
