<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>統計準1級 進捗</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#15263b;font-family:system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:clamp(14px,4vw,36px)}header{margin-bottom:22px}h1{font-size:clamp(22px,5vw,34px);margin:8px 0}h2{font-size:19px}.muted{color:#65738a}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #e4eaf2;border-radius:15px;padding:16px;min-width:0}.num{font-size:clamp(24px,6vw,36px);font-weight:750}.bar{display:flex;height:12px;border-radius:9px;overflow:hidden;background:#dfe6ee}.ok{background:#23875e}.mid{background:#edb74c}.bad{background:#db5858}.domain{padding:12px 0;border-bottom:1px solid #edf0f4}.domainhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.domain small{color:#65738a}input,select{font:inherit;max-width:100%}label.upload{display:block;background:#173a60;color:white;border-radius:10px;padding:12px;margin:16px 0;cursor:pointer;text-align:center}label.upload input{display:none}.topic{font-size:13px;color:#65738a;margin:8px 0}.note{background:#fff7e5;border-radius:12px;padding:12px;font-size:13px;margin:14px 0}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:420px){main{padding:12px}.card{padding:12px}}</style></head><body><main><header><div class="muted">統計検定 準1級 / 2027年版</div><h1>学習ダッシュボード</h1><p class="muted">GitHubの最新進捗を自動表示。スマートフォン対応。</p></header><label class="upload">最新の progress.json を読み込む<input id="file" type="file" accept=".json,application/json"></label><div class="note" id="notice">最新の進捗を読み込み中です。</div><div class="cards" id="cards"></div><h2>分野別網羅率</h2><div class="card" id="domains"></div><h2>未確認の論点</h2><div class="card" id="missing"></div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(d){const ts=d.topics||[];const confirmed=ts.filter(t=>['○','△','×'].includes(t.status)).length;const cnt=d.counts||{};document.getElementById('cards').innerHTML=[['累計問題',d.total_questions],['○',cnt['○']||0],['△',cnt['△']||0],['論点確認率',(ts.length?Math.round(confirmed/ts.length*1000)/10:0)+'%']].map(([k,v])=>'<div class="card"><div class="muted">'+esc(k)+'</div><div class="num">'+esc(v)+'</div></div>').join('');const domains=[...new Set(ts.map(t=>t.domain))];document.getElementById('domains').innerHTML=domains.map(name=>{const x=ts.filter(t=>t.domain===name),a=x.filter(t=>t.status==='○').length,b=x.filter(t=>t.status==='△').length,c=x.filter(t=>t.status==='×').length;return '<div class="domain"><div class="domainhead"><strong>'+esc(name)+'</strong><small>'+ (a+b+c)+' / '+x.length+' 論点確認</small></div><div class="bar"><div class="ok" style="width:'+100*a/x.length+'%"></div><div class="mid" style="width:'+100*b/x.length+'%"></div><div class="bad" style="width:'+100*c/x.length+'%"></div></div></div>'}).join('');const missing=ts.filter(t=>!['○','△','×'].includes(t.status));document.getElementById('missing').innerHTML='<p class="muted">'+missing.length+' 論点（履歴未確認 ≠ 未学習）</p>'+missing.slice(0,30).map(t=>'<div class="topic">'+esc(t.id)+' · '+esc(t.domain)+' / '+esc(t.name)+'</div>').join('')+(missing.length>30?'<p class="muted">ほか '+(missing.length-30)+' 論点</p>':'');}document.getElementById('file').addEventListener('change',async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.topics))throw Error('topicsがありません');render(d);document.getElementById('notice').textContent='読み込み完了：'+(d.updated_at||'更新日不明')}catch(e){alert('JSONの読み込みに失敗しました: '+e.message)}});async function load(){try{const res=await fetch("./data/progress.json?ts="+Date.now(),{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);const d=await res.json();render(d);document.getElementById("notice").textContent="GitHub同期データ: "+(d.updated_at||"更新日不明")}catch(e){document.getElementById("notice").textContent="自動読み込みできませんでした。JSONファイルを選択してください（"+e.message+"）"}}load();</script></body></html>
