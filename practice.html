<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122c47"><title>統計準1級｜演習</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f4f7fb;color:#17304a;margin:0}main{max-width:820px;margin:auto;padding:20px 16px 60px}h1{font-size:clamp(24px,5vw,32px)}h2{font-size:19px}a{color:#1d587d}.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.panel,.q{background:white;border:1px solid #e1e9f0;border-radius:16px;padding:18px;margin:14px 0}.sub{font-size:13px;color:#62768c;line-height:1.6}.q h3{margin:6px 0 12px}.lecture{background:#eef6f5;border-radius:10px;padding:12px;line-height:1.7}.question{line-height:1.8}.q details{border-top:1px solid #e7edf3;padding-top:12px;margin-top:14px}.q summary{cursor:pointer;color:#215f82}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,select{font:inherit}button{background:#173a60;border:0;border-radius:10px;color:white;padding:11px 14px;cursor:pointer}select{padding:9px;border-radius:9px;border:1px solid #ccd9e5;max-width:100%}.note{background:#fff6e5;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}#toast{font-size:12px;color:#54758d;margin-top:8px}footer{font-size:12px;color:#8191a2;margin-top:30px}@media(max-width:420px){main{padding:12px}.q,.panel{padding:14px}button{width:100%}} .formula{overflow-x:auto;padding:13px 7px;text-align:center;background:#fff;border-radius:10px;margin:12px 0;font-size:1.05rem}.katex-display{margin:.35em 0!important}.lecture .explain{line-height:1.85}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script></head><body><main><nav class="nav"><a href="./index.html">← 進捗ダッシュボード</a><span class="sub">演習専用ページ</span></nav><h1>講義・問題・解説</h1><p class="sub">1日5問 × 10日分の事前作成教材。解答はChatGPTで採点し、進捗JSONへ記録します。</p><div class="panel"><label for="day"><strong>教材セットを選択</strong></label><div style="margin-top:10px"><select id="day"></select></div><p class="note">問題を解く前に模範解答を開かないでください。正答・解説は公開JSON内に保存されており、画面上で折りたたんでいます。</p></div><div id="questions">教材を読み込み中...</div><p id="toast" aria-live="polite"></p><footer>解答テンプレートをコピーしてChatGPTへ貼り付ける方式です。WebサイトからGitHubへの書き込みは行いません。</footer></main><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let bank;const $=id=>document.getElementById(id);
function render(day){const group=bank.days.find(x=>x.day===Number(day));const qs=group.question_ids.map(id=>bank.questions.find(q=>q.id===id)).filter(Boolean);$("questions").innerHTML=qs.map(q=>'<article class="q"><div class="sub">'+esc(q.id)+' · '+esc(q.topic_id)+' · '+esc(q.level)+'</div><h3>'+esc(q.topic_name)+'</h3><div class="lecture"><strong>ミニ講義</strong><div class="formula" data-tex="'+esc(q.formula_latex||"")+'"></div><div>'+'<span class="math-prose">'+esc(q.lecture)+'</span></div><div style="margin-top:9px;font-size:13px;color:#466b66"><strong>典型ミス：</strong>'+esc(q.pitfall||'')+'</div></div><p class="question"><strong>問題</strong><br>'+'<span class="math-prose">'+esc(q.question)+'</span></p><details><summary>模範解答・解説を開く</summary><p><strong>正答：</strong>'+'<span class="math-prose">'+esc(q.answer)+'</span></p><p><strong>解説：</strong>'+'<span class="math-prose">'+esc(q.explanation)+'</span></p></details><div class="actions"><button data-id="'+esc(q.id)+'">解答用テンプレートをコピー</button></div></article>').join("");document.querySelectorAll(".math-prose").forEach(el=>{if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false})});document.querySelectorAll(".formula[data-tex]").forEach(el=>{if(window.katex){try{katex.render(el.dataset.tex,el,{displayMode:true,throwOnError:false,strict:"ignore"})}catch(e){el.textContent=el.dataset.tex}}else{el.textContent=el.dataset.tex}});document.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{const q=bank.questions.find(q=>q.id===b.dataset.id);const text="統計検定準1級の事前作成問題 "+q.id+"（論点 "+q.topic_id+"）を採点してください。GitHub F-L-A-D/statistics-study-tracker の data/lesson-bank.json で正答と解説を確認し、私の解答を○△×で評価してください。採点後は data/progress.json のhistoryに日本時間の解答日を含めて記録し、更新を検証してください。問題: "+q.question+"\n私の解答: ";try{await navigator.clipboard.writeText(text);$("toast").textContent=q.id+" の解答テンプレートをコピーしました。ChatGPTに貼り付けてください。"}catch(e){$("toast").textContent="コピーできませんでした。ChatGPTに問題ID "+q.id+" を伝えてください。"}})}
async function load(){try{const r=await fetch("./data/lesson-bank.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);bank=await r.json();$("day").innerHTML=bank.days.map(d=>'<option value="'+d.day+'">セット '+d.day+'（5問）</option>').join("");const param=Number(new URLSearchParams(location.search).get("day"));const day=bank.days.some(x=>x.day===param)?param:1;$("day").value=day;$("day").onchange=()=>{history.replaceState(null,"","?day="+$("day").value);render($("day").value)};render(day);if(!window.renderMathInElement){const s=document.querySelector("script[src*=auto-render]");s?.addEventListener("load",()=>render($("day").value),{once:true})}}catch(e){$("questions").textContent="教材の読み込みに失敗: "+e.message}}load();</script></body></html>
