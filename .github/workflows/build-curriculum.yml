name: Build SQLite curriculum and public JSON
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build-curriculum.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: curriculum-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize missing SQLite and export public JSON
        run: |
          python scripts/curriculum.py init
          python scripts/curriculum.py build
          python scripts/curriculum.py verify
      - name: Commit SQLite and generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curriculum.sqlite3 data/taxonomy.json data/lesson-bank.json data/lectures.json
          if ! git diff --cached --quiet; then
            git commit -m "Build SQLite curriculum and published JSON"
            git push
          fi
